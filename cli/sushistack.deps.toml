# SushiAI dependency fragment — the dependencies SushiAI owns on top of what
# SushiRuntime and SushiBLAS already provide. `hub` aggregates this with the
# SushiStack base fragment and (transitively) both siblings' own fragments
# when SushiAI is part of the workspace.
#
# SushiAI is orchestrated by SushiRuntime (via SushiBLAS), so it needs every
# toolchain both siblings need. Rather than repeat those here, the [module]
# table below declares both dependencies and `hub` folds their requirements
# into SushiAI's readiness picture.
#
# Three ports beyond that, declared below: the config layer's JSON parser and
# the two image decoders of modules/vision/codecs.
#
# It is declared HERE rather than in a vcpkg.json manifest, and that is a
# decision rather than an omission. A manifest beside the top-level
# CMakeLists.txt switches vcpkg out of classic mode, at which point the shared
# dependencies/vcpkg/installed tree leaves the prefix path - and that tree is
# exactly what `sa build` passes as CMAKE_PREFIX_PATH (see
# cli/sushiai/services/project.py), and where hwloc, gtest and opencl resolve
# from for this repository and both siblings. A manifest would therefore have
# to list the whole stack's dependencies, moving provisioning out of SushiStack
# and into SushiAI. No repository in the stack carries one.
#
# Field reference:
#   description    Human-readable purpose (shown by `hub doctor`).
#   required       false => a missing one warns but does not stop the build.
#   linux_apt      apt package names; empty list = not an apt/vcpkg package.
#   windows_vcpkg  vcpkg port names; empty list = not an apt/vcpkg package.
#   check_cmd      Optional command; exit 0 means "already installed".

[module]
depends_on = ["sushilog", "sushiprofiler", "sushiruntime", "sushiblas"]

# SushiLog, the one logger of the process, and SushiProfiler, the stack's one profiler. sa builds a
# package of each at the tag pinned here, or reuses one, and hands CMake its config folder.
[sushisystems.sushilog]
version = "v0.2.3"
commit  = "5f714a7bca6cad1a49e9a6133e75f0f791dba551"

[sushisystems.sushiprofiler]
version = "v0.3.2"
commit  = "8a963f1d792ab2ee10f1c4a6e7b8e8607cfaf91a"

# SushiRuntime, the task graph and devices. The CLI builds or reuses its package at this tag, so no checkout beside this one is needed.
[sushisystems.sushiruntime]
version = "v0.5.0"
commit  = "72e6ab6a1bfb22dc27e3a7c387ec86eee81ba6e7"

# SushiBLAS, the tensor and BLAS engine, pinned the same way.
[sushisystems.sushiblas]
version = "v0.1.0"
commit  = "e96ad707d6af5b00a34d0c2f6e8c5738e2e30fd8"

[nlohmann-json]
description   = "Header-only JSON parser. Read by modules/core/config/source/*.cpp alone, to turn a configuration file into Config::Value; the library's name appears in no public header, so it links PRIVATE and no consumer of SushiAI inherits it."
required      = true
linux_apt     = ["nlohmann-json3-dev"]
windows_vcpkg = ["nlohmann-json"]

[libjpeg-turbo]
description   = "JPEG decoder. Read by modules/vision/codecs/source/*.cpp alone, to turn the bytes of a JPEG file into an Imaging::Image; its headers appear in no public header, so it links PRIVATE to the sushiai_vision library."
required      = true
linux_apt     = ["libturbojpeg0-dev"]
windows_vcpkg = ["libjpeg-turbo"]

[libpng]
description   = "PNG decoder, with zlib beneath it. Read by modules/vision/codecs/source/*.cpp alone, for PNG images and segmentation masks; its headers appear in no public header, so it links PRIVATE to the sushiai_vision library."
required      = true
linux_apt     = ["libpng-dev"]
windows_vcpkg = ["libpng"]
