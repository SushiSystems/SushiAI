name: Set up sa
description: Installs Python, the sa CLI with its test extras from sushiai/cli/ and, on Linux, ccache.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: sushiai/cli/pyproject.toml
    - name: python -m pip install -e "./sushiai/cli[test]"
      shell: bash
      run: python -m pip install -e "./sushiai/cli[test]"
    - name: sudo apt-get install -y ccache
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends ccache
