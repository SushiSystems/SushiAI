name: CI

# The pre-merge stage on every pull request; the post-merge stage, which adds ThreadSanitizer and
# a build against the main branches of SushiRuntime and SushiBLAS, on every push to main and when
# nightly.yml calls this file. Every job runs the sa CLI, and each step is named after the command
# it runs. tests/README.md gives the sizes.
#
# SushiAI builds against SushiRuntime and SushiBLAS checkouts beside it (cmake/Runtime.cmake,
# cmake/BLAS.cmake), so the build jobs check this repository out under sushiai/ and the two
# siblings beside it. A pre-merge job checks out the refs SUSHIRUNTIME_REF and SUSHIBLAS_REF pin;
# the upstream-main job checks out their main. On Linux the compiler is the oneAPI icpx that
# setup-oneapi installs; SA_CXX hands it to sa, and icx takes the C slot. On Windows `sa setup`
# provisions the intel/llvm toolchain.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      post_merge:
        description: Run the post-merge jobs as well.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The sibling refs a pre-merge build checks out. docs/reference/KNOWN_ISSUES.md says why
  # SushiBLAS is not yet pinned to a tag.
  SUSHIRUNTIME_REF: v0.3.0
  SUSHIBLAS_REF: main
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # The OpenCL CPU JIT vectorizer crashes on one SushiBLAS kernel; see SushiBLAS's KNOWN_ISSUES.md.
  CL_CONFIG_CPU_VECTORIZER_MODE: "1"

jobs:
  checks:
    name: Checkers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: python tools/check_all.py .
        shell: bash
        run: echo "python tools/check_all.py ."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests

  cli:
    name: Python CLI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: sa test --cli
        run: echo "sa test --cli"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: ./sushiai/.github/actions/setup-sa
      - name: python -m pyflakes sushiai tests
        working-directory: sushiai/cli
        run: python -m pyflakes sushiai tests
      - name: sa test --cli
        working-directory: sushiai
        run: sa test --cli

  linux:
    name: Linux (small, medium)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
    steps:
      - name: sa build, sa test --label small, sa test --label medium
        working-directory: .
        run: echo "sa build; sa test --label small; sa test --label medium"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: ${{ env.SUSHIRUNTIME_REF }}
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          ref: ${{ env.SUSHIBLAS_REF }}
          path: sushiblas
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiai/.github/actions/setup-oneapi
      - uses: ./sushiai/.github/actions/setup-sa
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-release-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-
      - name: sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sa test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test --label small
      - name: sa test --label medium
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test --label medium

  windows:
    name: Windows (small, medium)
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sushiai
    steps:
      - name: sa setup, sa build, sa test --label small, sa test --label medium
        working-directory: .
        run: echo "sa setup --yes --no-gpu; sa build; sa test --label small; sa test --label medium"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: ${{ env.SUSHIRUNTIME_REF }}
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          ref: ${{ env.SUSHIBLAS_REF }}
          path: sushiblas
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiai/.github/actions/setup-sa
      - name: choco install ccache
        run: choco install ccache -y --no-progress
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-windows-intel-llvm-release-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-
      - name: sa setup --yes --no-gpu
        run: sa setup --yes --no-gpu
      - name: sa build
        run: sa build
      - name: sa test --label small
        run: sa test --label small
      - name: sa test --label medium
        run: sa test --label medium

  sanitizers:
    name: ASan and UBSan (small)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
    steps:
      - name: sa build --sanitize address-undefined, sa test --label small
        working-directory: .
        run: echo "sa build --sanitize address-undefined; sa test --label small"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: ${{ env.SUSHIRUNTIME_REF }}
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          ref: ${{ env.SUSHIBLAS_REF }}
          path: sushiblas
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiai/.github/actions/setup-oneapi
      - uses: ./sushiai/.github/actions/setup-sa
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-asan-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-
      # Release, because SushiRuntime turns ThreadSanitizer on for its own debug builds.
      - name: sa build --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sa test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test --label small

  gate:
    name: gate
    if: always()
    needs: [checks, cli, linux, windows, sanitizers]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every pre-merge job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  thread-sanitizer:
    name: ThreadSanitizer (small, medium)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
      # The SYCL runtime, oneTBB and the OpenCL CPU device are not instrumented, so TSan would
      # report races inside their own thread pools; this keeps it to the code built here.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
    steps:
      - name: sa build --type relwithdebinfo --sanitize thread, sa test --label small, sa test --label medium
        working-directory: .
        run: echo "sa build --type relwithdebinfo --sanitize thread; sa test --label small; sa test --label medium"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: ${{ env.SUSHIRUNTIME_REF }}
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          ref: ${{ env.SUSHIBLAS_REF }}
          path: sushiblas
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiai/.github/actions/setup-oneapi
      - uses: ./sushiai/.github/actions/setup-sa
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-tsan-${{ hashFiles('sushiai/**/CMakeLists.txt', 'sushiai/cmake/**') }}-
      # RelWithDebInfo, so SushiRuntime instruments its own threads as well.
      - name: sa build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sa test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test --label small
      - name: sa test --label medium
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test --label medium

  upstream-main:
    name: Against SushiRuntime and SushiBLAS main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
    steps:
      - name: sa build, sa test
        working-directory: .
        run: echo "sa build; sa test"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: main
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          ref: main
          path: sushiblas
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiai/.github/actions/setup-oneapi
      - uses: ./sushiai/.github/actions/setup-sa
      - name: sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sa test
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa test
